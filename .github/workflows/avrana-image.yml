# Avrana fork: test, then build both images from an avrana/* branch.
# Images: ghcr.io/<owner>/omnibus and ghcr.io/<owner>/omnibus-engine, tagged <branch>-<sha7> (linux/amd64, the avrana
# host). Deploys pin them BY DIGEST, which the build writes to the run summary. Upstream branches are untouched.
name: Avrana image

on:
  push:
    branches: ["avrana/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate
      - run: npx vitest run
      - name: Engine tests
        working-directory: omnibus-engine
        run: cargo test --locked

  image:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: omnibus
            context: .
          - name: omnibus-engine
            context: ./omnibus-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tag
        run: |
          safe=$(printf '%s' "$GITHUB_REF_NAME" | tr '/' '-' | tr -cd 'A-Za-z0-9._-')
          echo "tag=${safe}-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build and load locally first, so the web image can be smoke-run before anything is pushed.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      # The web image must serve pages, not only build: 2026-10-29 an image whose Edge middleware imported Prisma
      # passed every unit test and answered 500 on every page in production. Fresh SQLite database, no secrets.
      - name: Smoke-run the web image
        if: matrix.name == 'omnibus'
        env:
          IMAGE: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/config" && chmod 777 "$RUNNER_TEMP/config"
          docker run -d --name smoke -p 3000:3000 -v "$RUNNER_TEMP/config:/config"             -e DATABASE_URL=file:/config/omnibus.db -e NEXTAUTH_URL=http://localhost:3000             -e NEXTAUTH_SECRET="$(openssl rand -hex 32)" -e OMNIBUS_CACHE_DIR=/config/cache             -e OMNIBUS_LOGS_DIR=/config/logs -e OMNIBUS_BACKUPS_DIR=/config/backups "$IMAGE"
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            [ "$code" != 000 ] && break; sleep 2
          done
          behalf=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Api-Key: smoke' -H 'X-Omnibus-User: smoke'             'http://localhost:3000/api/search?query=x' || true)
          echo "page=$code on-behalf=$behalf"
          docker logs smoke 2>&1 | tail -20
          case "$code" in 2*|3*) ;; *) echo "::error::the home page answered $code"; exit 1;; esac
          case "$behalf" in 401|403) ;; *) echo "::error::an unknown on-behalf key answered $behalf, not 401/403"; exit 1;; esac
          if docker logs smoke 2>&1 | grep -q 'Edge Runtime'; then echo "::error::Prisma in the Edge runtime"; exit 1; fi
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Digest
        run: |
          echo "### ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo '`${{ steps.tag.outputs.image }}@${{ steps.build.outputs.digest }}`' >> "$GITHUB_STEP_SUMMARY"
